<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Turnover Monitoring System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <h1>Inventory Monitoring System</h1>

    <form id="inventoryForm">
        <div class="grid">
            <label>ITSS Support name: </label>
            <input type="text" id="itssSupportName" required>
            
            <label>Date & Time</label>
            <input type="datetime-local" id="datetime" required>

            <label>Lab Room / Office</label>
            <input type="text" id="location" required>

            <label>Terminal Number</label>
            <input type="text" id="terminal" required>

            <label>Status</label>
           <select id="status" required>
    <option value="">Select</option>
    <option value="Working">Working</option>
    <option value="Defective">Defective</option>
</select>

            <label>Replacement</label>
            <select id="replacement" required>
                <option value="">Select</option>
                <option value="Replaced">Replaced</option>
                <option value="Un-replaced">Dis-replaced</option>
            </select>

            <label>Instructor / Staff Name</label>
            <input type="text" id="staff" required>

            <label>Equipment</label>
            <input type="text" id="equipment" required>

            <label>Remarks/Serial Number</label>
            <textarea id="remarks" required></textarea>
        </div>

        <button type="submit">Submit Record</button>
    </form>

    <h2>Stored Records</h2>
    <button onclick="downloadCSV()">Download Excel</button>

    <div class="table-box">
        <table id="recordTable">
            <thead>
    <tr>
        <th>ITSS support Name</th>
        <th>Date & Time</th>
        <th>Lab Room / Office</th>
        <th>Terminal</th>
        <th>Status</th>
        <th>Replacement</th>
        <th>Staff</th>
        <th>Equipment</th>
        <th>Remarks</th>
        <th></th>
    </tr>
</thead>
<tbody></tbody>
        </table>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
